# Publica a imagem no GHCR e grava a tag no repo homelab — o Argo CD reconcilia a
# partir dali (ver helm/argocd/README.md, "Fluxo de deploy"). O cluster continua
# read-only para o CI: a credencial de escrita vive só nos secrets deste repo.
name: build-image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'design/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  IMAGEM: ghcr.io/thiagotn/prumo

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bump-homelab-tag:
    needs: build-push
    runs-on: ubuntu-latest

    steps:
      # The homelab repo is private, so the write-back needs its own SSH deploy key. Until
      # that secret exists this job warns and stops instead of failing the whole run — a
      # permanently red main teaches people to ignore CI. The image is already on GHCR;
      # only the tag write-back is pending. See ADR 0010 in the homelab repo.
      - name: Check for the homelab deploy key
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY}" ]; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=Deploy pendente::HOMELAB_DEPLOY_KEY nao configurado; a imagem ${TAG} foi publicada mas a tag nao foi gravada no repo homelab."
            {
              echo '### Deploy do homelab nao executado'
              echo
              echo "A imagem \`${TAG}\` foi publicada no GHCR, mas o secret \`HOMELAB_DEPLOY_KEY\` nao existe neste repo,"
              echo 'entao a tag nao foi escrita em `helm/apps/prumo/kustomization.yaml`.'
              echo
              echo 'Para ligar o deploy automatico: gere uma deploy key de ESCRITA no repo `homelab` e guarde a'
              echo 'chave privada em Settings -> Secrets -> Actions deste repo, como `HOMELAB_DEPLOY_KEY`.'
              echo
              echo "Enquanto isso, o deploy manual e: trocar \`newTag\` por \`${TAG}\` em"
              echo '`helm/apps/prumo/kustomization.yaml` e dar `git push` no repo homelab.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'present=true' >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          repository: thiagotn/homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          ref: main

      - name: Point the kustomization at the new image
        if: steps.key.outputs.present == 'true'
        env:
          TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          set -euo pipefail
          file=helm/apps/prumo/kustomization.yaml
          # Replace only the prumo image's newTag, leaving the rest of the file alone.
          sed -i "/name: ghcr.io\/thiagotn\/prumo$/{n;s|newTag: .*|newTag: ${TAG}|}" "$file"
          git diff --exit-code "$file" && echo "tag was already ${TAG}, nothing to do" && exit 0 || true

          git config user.name  'prumo-ci'
          git config user.email 'prumo-ci@users.noreply.github.com'
          git add "$file"
          git commit -m "prumo: image ${TAG} [skip ci]"
          git push
